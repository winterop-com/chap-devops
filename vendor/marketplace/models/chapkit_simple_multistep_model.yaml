schema_version: 2

id: chapkit_simple_multistep_model
service_id: chapkit-simple-multistep-model
display_name: Simple Multistep
kind: model

# The author's own chapkit AssessedStatus, copied from the service — not a
# marketplace verdict. orange = shows promise on limited data, needs careful
# evaluation. See models/README.md for the full scale.
assessed_status: orange

summary: >-
  Recursive multi-step forecaster: a RandomForest wrapped in skpro's
  ResidualDouble, fed per-location lag features and rolled forward one period
  at a time. Takes climate covariates but declares none required, so it also
  runs on lagged case history alone.

source:
  repository: https://github.com/chap-models/chapkit_simple_multistep_model
  image: ghcr.io/chap-models/chapkit_simple_multistep_model
  # Pure Python (scikit-learn + skpro) on the chapkit Python base. Multi-arch.
  runtime_image: ghcr.io/dhis2-chap/chapkit-py

attribution:
  author: HISP Oslo and HISP West and Central Africa

compatibility:
  period_types: [monthly]
  min_prediction_periods: 1
  max_prediction_periods: 100
  requires_geo: false

covariates:
  required: []
  defaults: []
  allow_free_additional: true

channels:
  stable: 0.1.4
  latest: 0.1.4

versions:
  - version: 0.1.4
    commit: 82dbe6a84dee44e1e84f2bbc5d2f2360ae4f516f
    image_tag: sha-82dbe6a
    chapkit: ">=2.2.0,<3"
    status: verified
    # Pinned by the maintainers without the three-approval round.
    verified_by: []
    changelog: >-
      Fits on lagged case history by default instead of demanding rainfall,
      mean_temperature and mean_relative_humidity, which the service never
      declared as required. A configuration now names the covariates it wants,
      and a missing configured column fails with a message that names it.
  - version: 0.1.3
    commit: 99a8586f0d741c278b89b8caa301a651184bc188
    image_tag: sha-99a8586
    chapkit: ">=2.2.0,<3"
    status: verified
    # Pinned by the maintainers without the three-approval round (security fix).
    verified_by: []
    changelog: >-
      Upgrades certifi to 2026.10.19, which drops trust in the compromised eMudhra intermediate CAs, and builds on the chapkit-py base with uv 0.13.4. No change to the model.
  - version: 0.1.2
    commit: 10b2bc7c7d66e825f382c002e56f7a38c5ca9293
    image_tag: sha-10b2bc7
    chapkit: ">=2.2.0,<3"
    status: verified
    # Pinned by the maintainers without the three-approval round.
    verified_by: []
    changelog: >-
      Exposes the service's metrics on /metrics (Prometheus format, OpenTelemetry). Built on chapkit 2.2.0 and servicekit 3.0.0. No change to the model.
  - version: 0.1.1
    commit: 6c1d9ee76f39194cde8df0794a761a648526bb63
    image_tag: sha-6c1d9ee
    chapkit: ">=2.1.2,<3"
    status: verified
    # Verified by the merge gate. Part of the chapkit 2.0.0 seed import.
    verified_by: []
    changelog: >-
      Require chapkit 2.1.2, whose failure messages keep the R error line
      instead of trailing warnings, and which applies the model
      configurations chap-core sends.
    notes: >-
      Supersedes the MLproject-based knutdrand/mstl_multistep_model listing.
      This is a different model — a RandomForest + skpro recursive
      forecaster, not MSTL + ARIMA with a forest correction.

configurations:
  monthly_climate:
    description: >-
      Climate-driven configuration: names rainfall, mean_temperature and
      mean_relative_humidity itself (the service defaults to none) and keeps
      the service's default hyperparameters, at the marketplace's reference
      three-period horizon (the service itself defaults to twelve). Six target lags give the
      one-step regressor half a year of history per location.
    config:
      prediction_periods: 3
      n_target_lags: 6
      n_samples: 100
      rf_max_depth: 10
      rf_min_samples_leaf: 5
      additional_continuous_covariates:
        - rainfall
        - mean_temperature
        - mean_relative_humidity
  monthly_selfhistory:
    description: >-
      Covariate-free variant: lagged case history only. Deliberately a
      weaker, differently-informed model — useful as a baseline and as an
      ensemble member on datasets with no usable climate data.
    config:
      prediction_periods: 3
      n_target_lags: 6
      n_samples: 100
      rf_max_depth: 10
      rf_min_samples_leaf: 5
      additional_continuous_covariates: []
