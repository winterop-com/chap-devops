schema_version: 2

id: chapkit_rwanda_malaria_bym_model
service_id: chapkit-rwanda-malaria-bym-model
display_name: Rwanda Malaria BYM
kind: model

# The author's own chapkit AssessedStatus, copied from the service — not a
# marketplace verdict. gray = not intended for use — deprecated, or kept only
# for backwards compatibility.
assessed_status: gray

summary: >-
  Spatio-temporal Bayesian model for malaria incidence in Rwanda at sector
  (ADM3) level: BYM spatial effects, RW1 temporal effects and an IID
  space-time interaction with lagged climate covariates, fitted with R-INLA.
  Built for one country's data — it needs geometry and the full climate
  covariate set.

developed_for: >-
  Monthly malaria cases in Rwanda at sector (ADM3) level.

source:
  repository: https://github.com/chap-models/chapkit_rwanda_malaria_bym_model
  image: ghcr.io/chap-models/chapkit_rwanda_malaria_bym_model
  # R + INLA, packaged as a chapkit shell-r service. The R-INLA model is
  # unchanged from knutdrand/Kigali-Malaria-modelling-23-27-Feb. amd64 only.
  runtime_image: ghcr.io/dhis2-chap/chapkit-r-inla

attribution:
  author: Similien NDAGIJIMANA (adapted by Chap team)
  organization: HISP Rwanda
  citation: >-
    Climate Health Analytics Platform. 2025. "Kigali Malaria BYM Model". HISP
    Rwanda.
  original_source: https://github.com/knutdrand/Kigali-Malaria-modelling-23-27-Feb

compatibility:
  period_types: [monthly]
  min_prediction_periods: 1
  max_prediction_periods: 24
  # The BYM spatial effect is built from an adjacency graph, so a GeoJSON
  # input is mandatory rather than optional.
  requires_geo: true

covariates:
  # All four are declared required, so chap supplies them automatically and
  # the model cannot run on a dataset that lacks any of them.
  required:
    - population
    - rainfall
    - mean_temperature
    - relative_humidity
  defaults: []
  allow_free_additional: true

channels:
  stable: 0.1.4
  latest: 0.1.4

versions:
  - version: 0.1.4
    commit: 84a27e835a19c091c7c5968dcc665c00695830f7
    image_tag: sha-84a27e8
    chapkit: ">=2.2.0,<3"
    status: verified
    # Pinned by the maintainers without the three-approval round (security fix).
    verified_by: []
    changelog: >-
      Upgrades certifi to 2026.10.19, which drops trust in the compromised eMudhra intermediate CAs, and builds on the chapkit-r-inla base with uv 0.13.4. No change to the model.
  - version: 0.1.3
    commit: 1ee5ea1792ea2cbbb591ace37c7b58d7a96f6f3a
    image_tag: sha-1ee5ea1
    chapkit: ">=2.2.0,<3"
    status: verified
    # Pinned by the maintainers without the three-approval round.
    verified_by: []
    changelog: >-
      Metrics on /metrics now use the stable OpenTelemetry names (http_server_request_duration_seconds_*). Built on chapkit 2.2.0 and servicekit 3.0.0. No change to the model.
  - version: 0.1.2
    commit: a7b2892d74c694f5140a315357061ab2592897c6
    image_tag: sha-a7b2892
    chapkit: ">=2.1.2,<3"
    status: verified
    # Verified by the merge gate. Part of the chapkit 2.0.0 seed import.
    verified_by: []
    changelog: >-
      Run as the unprivileged chapkit user on the chapkit-r-inla base that
      makes INLA executable for it; chapkit 2.1.2.
    notes: >-
      chap-core registers the pin as Rwanda Malaria BYM 0.1.2. The service runs
      as the unprivileged chapkit user (uid 1000) with its data under /work/data.

configurations:
  monthly:
    description: >-
      The only configuration the service exposes: every covariate it uses is
      required and auto-supplied, so prediction_periods is the single option.
      Supply Rwanda sector geometry alongside the data.
    config:
      prediction_periods: 3
